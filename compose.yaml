services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: redlens
      POSTGRES_USER: redlens
      POSTGRES_PASSWORD: redlens
    ports:
      - "5432:5432"
    volumes:
      - redlens-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redlens -d redlens"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redlens-postgres-data:
